<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乒奥乒乓球俱乐部 - 管理后台</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <div class="admin-container">
    <!-- 左侧导航 -->
    <aside class="admin-sidebar">
      <div class="admin-logo">
        <i class="fas fa-table-tennis"></i>
        <span>管理后台</span>
      </div>
      <nav class="admin-nav">
        <ul>
          <li class="nav-item active" data-tab="students">
            <i class="fas fa-users"></i>
            <span>学员管理</span>
          </li>
          <li class="nav-item" data-tab="events">
            <i class="fas fa-calendar-alt"></i>
            <span>活动管理</span>
          </li>
        </ul>
      </nav>
      <div class="admin-footer">
        <a href="index.html" target="_blank">返回首页</a>
      </div>
    </aside>

    <!-- 右侧内容区 -->
    <main class="admin-content">
      <!-- 学员管理 -->
      <div class="tab-content active" id="tab-students">
        <div class="content-header">
          <h2><i class="fas fa-users"></i> 学员管理</h2>
          <button class="btn-primary" id="add-student-btn">
            <i class="fas fa-plus"></i> 添加学员
          </button>
        </div>
        
        <div class="search-bar">
          <input type="text" id="student-search" placeholder="搜索学员姓名...">
          <button class="btn-secondary" id="search-btn">搜索</button>
        </div>

        <table class="data-table" id="students-table">
          <thead>
            <tr>
              <th>头像</th>
              <th>姓名</th>
              <th>年龄</th>
              <th>段位</th>
              <th>里程碑数</th>
              <th>成绩数</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="students-tbody">
            <!-- 学员列表由JS动态生成 -->
          </tbody>
        </table>
      </div>

      <!-- 活动管理 -->
      <div class="tab-content" id="tab-events">
        <div class="content-header">
          <h2><i class="fas fa-calendar-alt"></i> 活动管理</h2>
          <button class="btn-primary" id="add-event-btn">
            <i class="fas fa-plus"></i> 添加活动
          </button>
        </div>

        <div class="search-bar">
          <input type="text" id="event-search" placeholder="搜索活动名称...">
          <button class="btn-secondary" id="event-search-btn">搜索</button>
        </div>

        <table class="data-table" id="events-table">
          <thead>
            <tr>
              <th>图片</th>
              <th>活动名称</th>
              <th>日期</th>
              <th>地点</th>
              <th>图片数</th>
              <th>里程碑数</th>
              <th>成果数</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="events-tbody">
            <!-- 活动列表由JS动态生成 -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- 学员编辑弹窗 -->
  <div class="modal-overlay" id="student-modal-overlay"></div>
  <div class="modal-form" id="student-modal">
    <div class="modal-header">
      <h3 id="student-modal-title">添加学员</h3>
      <button class="modal-close" id="student-modal-close">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <form id="student-form">
      <input type="hidden" id="student-id">
      
      <div class="form-row">
        <div class="form-group">
          <label>姓名 <span class="required">*</span></label>
          <input type="text" id="student-name" required>
        </div>
        <div class="form-group">
          <label>年龄 <span class="required">*</span></label>
          <input type="number" id="student-age" required min="1">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>段位 <span class="required">*</span></label>
          <input type="text" id="student-level" required placeholder="如：业余二段">
        </div>
        <div class="form-group">
          <label>头像图片路径</label>
          <input type="text" id="student-image" placeholder="images/student1.jpg">
        </div>
      </div>

      <!-- 里程碑 -->
      <div class="form-group">
        <label>里程碑</label>
        <div id="student-milestones-list">
          <!-- 里程碑列表由JS生成 -->
        </div>
        <button type="button" class="btn-secondary" id="add-student-milestone">
          <i class="fas fa-plus"></i> 添加里程碑
        </button>
      </div>

      <!-- 成绩 -->
      <div class="form-group">
        <label>取得成绩</label>
        <div id="student-achievements-list">
          <!-- 成绩列表由JS生成 -->
        </div>
        <button type="button" class="btn-secondary" id="add-student-achievement">
          <i class="fas fa-plus"></i> 添加成绩
        </button>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" id="student-cancel-btn">取消</button>
        <button type="submit" class="btn-primary">保存</button>
      </div>
    </form>
  </div>

  <!-- 活动编辑弹窗 -->
  <div class="modal-overlay" id="event-modal-overlay"></div>
  <div class="modal-form" id="event-modal">
    <div class="modal-header">
      <h3 id="event-modal-title">添加活动</h3>
      <button class="modal-close" id="event-modal-close">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <form id="event-form">
      <input type="hidden" id="event-id">

      <div class="form-row">
        <div class="form-group">
          <label>活动名称 <span class="required">*</span></label>
          <input type="text" id="event-title" required>
        </div>
        <div class="form-group">
          <label>日期 <span class="required">*</span></label>
          <input type="date" id="event-date" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>地点 <span class="required">*</span></label>
          <input type="text" id="event-location" required>
        </div>
        <div class="form-group">
          <label>图片路径（多条用逗号分隔）</label>
          <input type="text" id="event-images" placeholder="images/event1-1.jpg,images/event1-2.jpg">
        </div>
      </div>

      <div class="form-group">
        <label>活动描述</label>
        <textarea id="event-description" rows="3"></textarea>
      </div>

      <!-- 里程碑 -->
      <div class="form-group">
        <label>活动里程碑</label>
        <div id="event-milestones-list">
          <!-- 里程碑列表由JS生成 -->
        </div>
        <button type="button" class="btn-secondary" id="add-event-milestone">
          <i class="fas fa-plus"></i> 添加里程碑
        </button>
      </div>

      <!-- 比赛成果 -->
      <div class="form-group">
        <label>比赛成果</label>
        <div id="event-results-list">
          <!-- 成果列表由JS生成 -->
        </div>
        <button type="button" class="btn-secondary" id="add-event-result">
          <i class="fas fa-plus"></i> 添加成果
        </button>
      </div>

      <!-- 精彩亮点 -->
      <div class="form-group">
        <label>精彩亮点</label>
        <div id="event-highlights-list">
          <!-- 亮点列表由JS生成 -->
        </div>
        <button type="button" class="btn-secondary" id="add-event-highlight">
          <i class="fas fa-plus"></i> 添加亮点
        </button>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" id="event-cancel-btn">取消</button>
        <button type="submit" class="btn-primary">保存</button>
      </div>
    </form>
  </div>

  <!-- 确认删除弹窗 -->
  <div class="modal-overlay" id="confirm-modal-overlay"></div>
  <div class="modal-form" id="confirm-modal">
    <div class="modal-header">
      <h3>确认删除</h3>
      <button class="modal-close" id="confirm-modal-close">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="confirm-content">
      <p id="confirm-message">确定要删除吗？</p>
    </div>
    <div class="form-actions">
      <button type="button" class="btn-secondary" id="confirm-cancel-btn">取消</button>
      <button type="button" class="btn-danger" id="confirm-ok-btn">确定删除</button>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div class="toast" id="toast">操作成功</div>

  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
